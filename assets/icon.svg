<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="75%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#f5d0fe" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f5d0fe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="play" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Glass body -->
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#body)"/>

  <!-- Inner radial glow -->
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#innerGlow)"/>

  <!-- Top shine highlight (clipped to rounded rect) -->
  <path d="M 72 16 H 184 C 215 16 240 41 240 72 V 132 H 16 V 72 C 16 41 41 16 72 16 Z" fill="url(#shine)"/>

  <!-- Subtle inner border -->
  <rect x="17" y="17" width="222" height="222" rx="55" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="2"/>

  <!-- Play triangle -->
  <g filter="url(#softShadow)">
    <path d="M 104 80 L 104 176 L 184 128 Z" fill="url(#play)"/>
  </g>
</svg>
