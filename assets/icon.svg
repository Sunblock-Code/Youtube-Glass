<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe"/>
      <stop offset="35%" stop-color="#a855f7"/>
      <stop offset="75%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="50%" cy="18%" r="82%">
      <stop offset="0%" stop-color="#f5d0fe" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#f5d0fe" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="play" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <!-- Tighter, sharper drop shadow so the play mark stays crisp when the
         icon is downscaled to 16-48 px for the taskbar. -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Glass body — only 6px margin (was 16) so the icon fills the taskbar
       slot far more, i.e. visibly bigger at the same DPI. -->
  <rect x="6" y="6" width="244" height="244" rx="54" fill="url(#body)"/>

  <!-- Inner radial glow -->
  <rect x="6" y="6" width="244" height="244" rx="54" fill="url(#innerGlow)"/>

  <!-- Top shine highlight (clipped to rounded rect) -->
  <path d="M 60 6 H 196 C 226 6 250 30 250 60 V 130 H 6 V 60 C 6 30 30 6 60 6 Z" fill="url(#shine)"/>

  <!-- Crisp inner border -->
  <rect x="7.25" y="7.25" width="241.5" height="241.5" rx="52.75" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="2.5"/>

  <!-- Play triangle — larger and optically centred (slightly left of true
       centre so the right-pointing shape reads balanced). -->
  <g filter="url(#softShadow)">
    <path d="M 96 70 L 96 186 L 196 128 Z" fill="url(#play)"/>
  </g>
</svg>
