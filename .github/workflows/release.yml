name: Release

on:
  push:
    tags:
      - 'v*'   # any tag starting with v (v0.1.0, v1.2.3, etc.)
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write   # needed so electron-builder's GitHub publisher can attach assets
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build icon
        run: npm run build:icon

      - name: Build + publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release

      - name: Upload build artifacts (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: glass-windows
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: ignore
