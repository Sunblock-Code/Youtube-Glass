<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src * data: blob:; media-src * blob:; connect-src *; style-src 'self' 'unsafe-inline'; script-src 'self';">
  <title>Glass</title>
  <!--
    Boot script: applies the user's theme + sign-in label BEFORE the
    stylesheet paints. Inline scripts are blocked by the page's CSP
    (`script-src 'self'`), so this lives in renderer/boot.js and is
    loaded as a same-origin file — that satisfies the policy and still
    runs synchronously during HTML parse, before any paint.
  -->
  <script src="boot.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Frosted bg mode: blurred wallpaper stand-in, positioned by app.js to
       line up with the desktop behind the window. Earlier sibling of .bg at
       the same z-index, so the dim veil + cards stack over it. -->
  <div id="frostbg" aria-hidden="true">
    <div class="frost-img"></div>
  </div>
  <div class="bg" aria-hidden="true">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <header class="titlebar">
    <button class="brand" id="home-btn" title="Home" aria-label="Home">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="white"><polygon points="8,5 20,12 8,19"/></svg>
      </span>
      <span class="brand-text">Glass</span>
    </button>
    <button class="back-btn" id="back-btn" title="Back (Alt+←)" aria-label="Back" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <button class="back-btn" id="fwd-btn" title="Forward (Alt+→)" aria-label="Forward" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>
    <div class="search-wrap">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input id="search" placeholder="Search or paste a YouTube link" autocomplete="off" spellcheck="false" />
      <kbd class="search-hint">Ctrl K</kbd>
    </div>
    <nav class="topnav">
      <button data-route="subs" title="Subs">
        <svg class="topnav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 11a9 9 0 0 1 9 9"/>
          <path d="M4 4a16 16 0 0 1 16 16"/>
          <circle cx="5" cy="19" r="1.5" fill="currentColor"/>
        </svg>
        <span class="topnav-label">Subs</span>
      </button>
      <button data-route="shorts" title="Shorts">
        <svg class="topnav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <span class="topnav-label">Shorts</span>
      </button>
      <button data-route="history" title="History">
        <svg class="topnav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 3-6.7"/>
          <polyline points="3 4 3 10 9 10"/>
          <polyline points="12 7 12 12 15 14"/>
        </svg>
        <span class="topnav-label">History</span>
      </button>
      <button data-route="queue" title="Queue">
        <svg class="topnav-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="3" y1="6" x2="14" y2="6"/><line x1="3" y1="12" x2="14" y2="12"/><line x1="3" y1="18" x2="11" y2="18"/><polygon points="17 11 22 15 17 19" fill="currentColor" stroke="none"/>
        </svg>
        <span class="topnav-label">Queue</span>
        <span class="topnav-queue-count" id="topnav-queue-count" hidden></span>
      </button>
      <button id="donate-btn" class="donate-btn" title="Support development of Glass">
        <span class="donate-heart" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-7.5-4.6-10-9.2C.6 9.1 1.6 5.7 4.7 4.8 6.8 4.2 8.9 5.1 10 6.8c.4.6.6.9 1 1.5.4-.6.6-.9 1-1.5 1.1-1.7 3.2-2.6 5.3-2 3.1.9 4.1 4.3 2.7 7C19.5 16.4 12 21 12 21z"/></svg></span><span>Donate</span>
      </button>
      <button id="account-btn" title="Sign in">Sign in</button>
      <button id="wp-btn" class="icon-btn wp-btn" title="Watch together" aria-label="Watch together">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>
        <span id="wp-badge" class="wp-badge" hidden></span>
      </button>
      <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <button id="pass-btn" class="icon-btn" title="Install Proton Pass extension" aria-label="Proton Pass">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
        </svg>
      </button>
    </nav>
    <div class="window-controls" aria-label="Window controls">
      <button id="win-min" class="win-ctrl" title="Minimize" aria-label="Minimize">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
          <line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
      </button>
      <button id="win-max" class="win-ctrl" title="Maximize" aria-label="Maximize">
        <svg class="win-max-glyph" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="4" y="4" width="16" height="16" rx="2.5"/>
        </svg>
        <svg class="win-restore-glyph" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="8" y="3.5" width="12.5" height="12.5" rx="2.5"/>
          <path d="M16 20H6a2 2 0 0 1-2-2V8"/>
        </svg>
      </button>
      <button id="win-close" class="win-ctrl win-close" title="Close" aria-label="Close">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true">
          <line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
        </svg>
      </button>
    </div>
  </header>

  <div id="banner"></div>
  <main id="view"></main>

  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-bg"></div>
    <div class="modal-card" role="dialog" aria-modal="true">
      <div id="modal-body"></div>
    </div>
  </div>
  <input type="file" id="takeout-file" accept=".csv,.json" hidden />

  <script src="../node_modules/hls.js/dist/hls.min.js"></script>
  <script src="../node_modules/dashjs/dist/dash.all.min.js"></script>
  <script src="../node_modules/peerjs/dist/peerjs.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
